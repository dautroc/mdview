[workspace]
resolver = "2"
members = ["crates/mdcore", "crates/mdapp"]

[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.75"

[workspace.dependencies]
pulldown-cmark = "0.13"
syntect = "5"
notify = "8"
thiserror = "2"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-web-kit = "0.3"
insta = "1"
