# Builds a universal DMG and attaches it to a GitHub release.
#
# Tag a release to run it:  git tag v0.1.0 && git push origin v0.1.0
#
# The app is ad-hoc signed only. There is no Developer ID here, so the DMG is
# not notarized and first launch needs the Gatekeeper step described in the
# README. Adding notarization later means adding a signing identity and a
# notarytool step; nothing else about this workflow changes.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    # macOS runner: the build links against AppKit and WebKit, and the bundle
    # is assembled with codesign, hdiutil and lipo.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install both target architectures
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # `make dist` runs the test suite first, which includes the guard that
      # Cargo.toml and Info.plist agree about the version.
      - name: Build the DMG
        run: make dist

      - name: Check the tag matches the version that was built
        run: |
          version=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
          body: |
            Universal build for Apple silicon and Intel.

            This app is not notarized, so macOS will refuse it on first launch.
            Open **System Settings → Privacy & Security**, find MDView near the
            bottom and choose **Open Anyway**. Or clear the quarantine flag:

            ```sh
            xattr -d -r com.apple.quarantine /Applications/MDView.app
            ```

            To get the `mdview` command:

            ```sh
            ln -sf /Applications/MDView.app/Contents/Resources/mdview /usr/local/bin/mdview
            ```
